<div class="container">
    <div class="card mt-3">
        <div class="row">
            <div class="col">
                <h2 class="text-center">Create New Appointment</h2>
            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <input class="form-control" [(ngModel)]="newTitle" type="text" placeholder="Appointment Description">
        </div>
        <div class="col-md-4">
            <input class="form-control" [(ngModel)]="newDate" type="date" placeholder="Appointment Description">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" (click)="addAppointment()">Add</button>
        </div>
    </div>

    <h2 class="text-center mt-5">Appointments</h2>

    <div>
        <ul class="list-group mt-3">
            <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let appointment of appointments, index as i">
                {{appointment.title}} "Date: {{appointment.date | date: "yy.dd.yyyy"}}" 
                <button class="btn btn-danger" (click)="removeAppointment(i)"> Delete </button>
            </li>
        </ul>
    </div>
</div>
